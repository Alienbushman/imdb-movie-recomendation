imdb_datasets:
  # IMDB bulk dataset files (downloaded to data/datasets/)
  title_basics: "data/datasets/title.basics.tsv.gz"
  title_ratings: "data/datasets/title.ratings.tsv.gz"
  title_principals: "data/datasets/title.principals.tsv.gz"
  title_akas: "data/datasets/title.akas.tsv.gz"
  name_basics: "data/datasets/name.basics.tsv.gz"
  title_crew: "data/datasets/title.crew.tsv.gz"
  anime_list: "data/datasets/anime-list-mini.json"
  anime_list_url: "https://raw.githubusercontent.com/Fribb/anime-lists/master/anime-list-mini.json"
  # Minimum vote count to consider a title (filters out obscure titles)
  min_vote_count: 100
  # Minimum IMDB rating to consider.
  # NOTE (2026-09-07): 5.0 provably makes part of this library unreachable —
  # 14% of everything rated here that IMDB scores under 5.5 got 8+/10. Lowering
  # it to 3.0 was tried and REVERTED: the pool grew 143k -> 195k and the top
  # recommendations became obscure kids/TV titles (26 of the top 100 had under
  # 1000 votes). Cause is the model, not the pool — `rating_vote_ratio` is
  # imdb_rating / log1p(num_votes), the 2nd-heaviest feature, so it actively
  # rewards obscurity and a wider pool just feeds it. Fix that feature first,
  # then lower this. See tickets/023.
  min_rating: 5.0
  # Earliest release year to include (0 = no filter).
  # NOTE (2026-09-07): 1970 excludes the best-performing eras in this library
  # (1950s 8.11, 1940s 7.29, vs 6.98 for 1970+). Reverted alongside min_rating
  # for the same reason — see tickets/023.
  min_year: 1970
  # Title types to include from IMDB datasets
  include_title_types: ["movie", "tvSeries", "tvMiniSeries", "tvMovie"]

features:
  # Popularity tier thresholds (num_votes boundaries)
  popularity_tiers: [25000, 100000, 500000]
  # Top languages for one-hot encoding
  top_languages:
    - English
    - French
    - German
    - Japanese
    - Korean
    - Spanish
    - Italian
    - Hindi
    - Chinese
    - Portuguese
    - Swedish
    - Danish
    - Turkish
    - Russian
  # Maximum number of genre interaction pairs to use
  max_genre_pairs: 15

model:
  # T1.1: Training objective. "lambdarank" (default) optimises NDCG directly via
  # pairwise pseudo-labels — recommendations are inherently a ranking problem.
  # "regression" keeps the legacy LGBMRegressor MAE-style behaviour.
  objective: "lambdarank"
  # Eval metric for early stopping / log output ("ndcg", "map", "mae", "rmse").
  metric: "ndcg"
  # k for ranking metrics (NDCG@k / MAP@k / Recall@k).
  ndcg_at_k: 10
  # Rating at or above which a holdout title is "relevant" for map/mrr/recall.
  # At 7.0 these pinned to exactly 1.0000 (~47% of this library is rated 7+),
  # so they measured nothing. 8.0 makes them discriminate again.
  relevance_threshold: 8.0
  # LightGBM hyperparameters
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 31
  min_child_samples: 5
  reg_alpha: 0.0
  reg_lambda: 0.0
  feature_fraction: 1.0
  bagging_fraction: 1.0
  bagging_freq: 0
  # Train/test split ratio (used by both temporal and random modes)
  test_size: 0.2
  random_state: 42
  # T1.3: Temporal vs random holdout. "temporal" = most-recent rate_date rows
  # become the test set, which is the honest eval for taste drift.
  split:
    mode: "temporal"  # "temporal" | "random"
  # T1.4: Recency decay weights. Older ratings shrink toward `min_weight`.
  decay:
    enabled: true
    half_life_days: 730  # 2 years
    min_weight: 0.05
    fallback_weight: 0.5  # used when a row has no rate_date
  # T2.9: Cross-validation. When enabled, NDCG@k is reported as mean ± std over
  # n_folds expanding-window splits. Optuna uses this score when both flags on.
  cv:
    enabled: false
    n_folds: 5
    strategy: "temporal"  # "temporal" | "random"
  # T1.2: Optuna hyperparameter tuning. Disabled by default — turn on for one-off
  # tuning runs; persists best params back into the saved model metadata.
  optuna:
    enabled: false
    n_trials: 25
    timeout_seconds: 600
  # T2.8: Wire dismissed titles into training as low-rating implicit negatives.
  training:
    use_dismissals: true
    dismissal_label: 2.0
    dismissal_weight: 0.3
    # T3.13: Wire frontend feedback (thumbs up/down/not interested) into training.
    use_feedback: true
    feedback_up_label: 9.0
    feedback_down_label: 3.0
    feedback_not_interested_label: 2.0
    feedback_weight: 0.3
  # T1.5: SHAP-based explanations. Falls back to heuristic if SHAP fails.
  shap:
    enabled: true
    top_k: 3

similarity:
  # T2.7: Similarity engine for /similar/{id}. "leaves" uses tree-leaf embeddings
  # from the trained LGB model (Facebook GBDT+LR trick). "jaccard" is the legacy
  # heuristic (genre Jaccard + binary director match).
  method: "leaves"  # "leaves" | "jaccard"

mmr:
  # T2.6: Maximal Marginal Relevance re-ranking after scoring.
  # lambda = 1.0 means pure relevance; 0.0 means pure diversity.
  enabled: true
  lambda_: 0.7
  pool_size: 200  # top-N candidates considered for re-ranking (O(k^2) on this set)

recommendations:
  # How many recommendations to return per category
  top_n_movies: 20
  top_n_series: 10
  top_n_anime: 10
  # Minimum predicted score to include
  min_predicted_score: 6.5

categories:
  movie:
    title_types: ["movie", "tvMovie"]
    label: "Movies"
  series:
    title_types: ["tvSeries", "tvMiniSeries"]
    label: "Series"
  anime:
    title_types: ["movie", "tvSeries", "tvMiniSeries"]
    label: "Anime"

data:
  # Path to IMDB export CSV relative to project root
  watchlist_path: "data/watchlist.csv"
  # Where to cache processed candidate data
  cache_dir: "data/cache"
